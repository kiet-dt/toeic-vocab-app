<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f8f5f" />
  <title>Luyện từ vựng Toeic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #e7f3ec;
      --bg1: #f7fbf8;
      --card: #ffffff;
      --line: #c5ddd0;
      --text: #143528;
      --muted: #5f7a6c;
      --accent: #1f8f5f;
      --accent-dim: #187a50;
      --warn: #9a6b00;
      --bad: #c0392b;
      --good: #0f7a4a;
      --shadow: 0 16px 40px rgba(20, 53, 40, 0.08);
      --radius: 18px;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 0% 0%, #c8e8d6 0%, transparent 60%),
        radial-gradient(700px 380px at 100% 10%, #d9efe4 0%, transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x: hidden;
    }

    .wrap {
      width: min(760px, calc(100% - 2rem));
      margin: 0 auto;
      padding: calc(2rem + var(--safe-top)) max(0px, var(--safe-right)) calc(3rem + var(--safe-bottom)) max(0px, var(--safe-left));
    }

    header h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.45rem, 5.5vw, 2.1rem);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    header p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs, .dirs, .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }

    button, .chip {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      min-height: var(--tap);
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    button:hover { border-color: var(--accent); }

    button:active {
      transform: scale(0.98);
    }

    button.active, .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.4rem 1.35rem 1.5rem;
      transition: opacity 0.22s ease, transform 0.22s ease;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .card.card-transition {
      opacity: 0;
      transform: translateY(8px) scale(0.99);
    }

    .meta {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .prompt {
      font-size: clamp(1.2rem, 4.2vw, 1.85rem);
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.1rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .answer-row {
      display: grid;
      gap: 0.7rem;
    }

    input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 16px; /* avoid iOS zoom on focus */
      line-height: 1.4;
      min-height: var(--tap);
      padding: 0.85rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #f3faf6;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 143, 95, 0.18);
      background: #fff;
    }

    .hint-box {
      min-height: 1.4rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.08em;
      color: var(--warn);
      font-size: 0.98rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
      margin-top: 1rem;
    }

    .actions .primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: 700;
      grid-column: 1 / -1;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: none;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .feedback.show { display: block; }
    .feedback.ok {
      background: #e7f8ef;
      border-color: #9fd9b8;
      color: var(--good);
    }
    .feedback.bad {
      background: #fdecec;
      border-color: #f0b4b4;
      color: var(--bad);
    }
    .feedback.info {
      background: #fff6e5;
      border-color: #ecd29a;
      color: var(--warn);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }

    .mode-tabs button {
      width: 100%;
    }

    #practicePanel.hidden,
    #lexiconPanel.hidden,
    .toolbar.hidden {
      display: none !important;
    }

    .lexicon-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1rem 1.2rem;
    }

    .lexicon-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }

    .lexicon-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .lexicon-count {
      color: var(--muted);
      font-size: 0.85rem;
    }

    #lexiconSearch {
      width: 100%;
      font: inherit;
      font-size: 16px;
      min-height: var(--tap);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #f3faf6;
      color: var(--text);
      outline: none;
      margin-bottom: 0.85rem;
      -webkit-appearance: none;
      appearance: none;
    }

    #lexiconSearch:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 143, 95, 0.18);
      background: #fff;
    }

    .table-wrap {
      overflow: auto;
      max-height: min(70vh, 640px);
      border: 1px solid var(--line);
      border-radius: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    .vocab-table th,
    .vocab-table td {
      padding: 0.65rem 0.7rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    .vocab-table th {
      position: sticky;
      top: 0;
      background: #eaf6ef;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      z-index: 1;
    }

    .vocab-table tr:last-child td { border-bottom: none; }
    .vocab-table tbody tr:nth-child(even) { background: #f7fbf8; }
    .vocab-table .col-num {
      width: 2.4rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .vocab-table .col-en {
      font-weight: 600;
      white-space: nowrap;
      min-width: 7rem;
    }
    .vocab-table .col-vi {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .lexicon-empty {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 1.25rem 0.5rem;
      font-size: 0.92rem;
    }

    .lexicon-empty.show { display: block; }

    @media (min-width: 641px) {
      .actions {
        display: flex;
        flex-wrap: wrap;
      }
      .actions .primary { grid-column: auto; }
      input[type="text"],
      #lexiconSearch { font-size: 1.1rem; }
      .mode-tabs {
        display: flex;
        flex-wrap: wrap;
      }
      .mode-tabs button { width: auto; }
    }

    @media (max-width: 640px) {
      .wrap {
        width: calc(100% - 1rem);
        padding-top: calc(1rem + var(--safe-top));
        padding-bottom: calc(1.5rem + var(--safe-bottom));
      }

      .tabs, .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .mode-tabs {
        grid-template-columns: 1fr 1fr;
      }

      .tabs button,
      .toolbar button,
      .actions button {
        width: 100%;
        justify-content: center;
        font-size: 0.92rem;
        padding: 0.65rem 0.7rem;
      }

      .mode-tabs button {
        font-size: 0.82rem;
        padding: 0.6rem 0.4rem;
      }

      .card {
        padding: 1.1rem 1rem 1.2rem;
        border-radius: 16px;
      }

      .meta {
        font-size: 0.8rem;
        margin-bottom: 0.85rem;
      }

      .prompt {
        margin-bottom: 1rem;
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .vocab-table {
        width: 100%;
        /* rộng hơn màn hình điện thoại một chút để vuốt ngang được;
           cột nghĩa vẫn tự xuống dòng khi dài */
        min-width: 28rem;
      }

      .vocab-table .col-num,
      .vocab-table th.col-num {
        width: 2rem;
        min-width: 2rem;
        padding-left: 0.5rem;
        padding-right: 0.25rem;
        font-size: 0.82rem;
      }

      .vocab-table .col-en,
      .vocab-table .col-vi {
        font-size: 0.88rem;
      }

      .vocab-table th,
      .vocab-table td {
        padding: 0.5rem 0.45rem;
      }
    }

    @media (max-width: 380px) {
      header h1 { font-size: 1.3rem; }
      .tabs button,
      .toolbar button,
      .actions button {
        font-size: 0.85rem;
        padding: 0.6rem 0.45rem;
      }
      .mode-tabs button {
        font-size: 0.74rem;
        padding: 0.55rem 0.3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none !important;
      }
    }

    /* ---------- Thêm từ ---------- */
    .mode-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #addPanel.hidden { display: none !important; }
    .add-form { display: grid; gap: 0.5rem; }
    .add-form label { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    input[type="password"] {
      width: 100%;
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      min-height: var(--tap);
      padding: 0.85rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #f3faf6;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 143, 95, 0.18);
      background: #fff;
    }
    .add-form .primary {
      margin-top: 0.8rem;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: 700;
      border-radius: 14px;
    }
    .del-word {
      display: inline-flex;
      min-height: 36px;
      margin-top: 0.35rem;
      margin-left: 0.4rem;
      padding: 0.2rem 0.85rem;
      font-size: 0.75rem;
      color: var(--bad);
      border-color: #efc4be;
      vertical-align: baseline;
    }

    /* ---------- Tài khoản ---------- */
    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin: -0.4rem 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .account-bar b { color: var(--text); }
    .account-bar button { font-size: 0.85rem; padding: 0.3rem 0.95rem; }
    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .auth-tabs button { font-size: 0.82rem; padding: 0.5rem 0.25rem; line-height: 1.25; }
    @media (max-width: 380px) {
      .auth-tabs { gap: 0.3rem; }
      .auth-tabs button { font-size: 0.74rem; padding: 0.5rem 0.15rem; }
      .account-bar { font-size: 0.82rem; }
    }
    .auth-note { color: var(--muted); font-size: 0.85rem; line-height: 1.45; margin: 0 0 0.6rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Luyện từ vựng Toeic</h1>
      <div class="account-bar" id="accountBar"></div>
    </header>

    <div class="mode-tabs" id="modeTabs">
      <button type="button" class="active" data-mode="practice">Luyện tập</button>
      <button type="button" data-mode="lexicon">Tổng hợp từ vựng</button>
      <button type="button" data-mode="add">Thêm từ</button>
    </div>

    <div class="tabs" id="sectionTabs">
      <button type="button" class="active" data-section="reading">Đọc hiểu (<span id="countReading">0</span>)</button>
      <button type="button" data-section="listening">Nghe (<span id="countListening">0</span>)</button>
    </div>

    <div class="toolbar" id="practiceToolbar">
      <button type="button" id="btnShuffle">Xáo trộn lại</button>
    </div>

    <div id="practicePanel">
      <div class="card" id="practiceCard">
        <div class="meta">
          <span id="progress">1 / 1</span>
        </div>
        <div class="prompt" id="prompt">—</div>
        <div class="answer-row">
          <input id="answer" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Nhập đáp án..." />
          <div class="hint-box" id="hintBox"></div>
        </div>
        <div class="actions">
          <button type="button" class="primary" id="btnCheck">Kiểm tra</button>
          <button type="button" id="btnHint">Gợi ý</button>
          <button type="button" id="btnShow">Xem đáp án</button>
          <button type="button" id="btnNext">Từ tiếp theo</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div id="lexiconPanel" class="hidden">
      <div class="lexicon-card">
        <div class="lexicon-head">
          <h2 id="lexiconTitle">Từ vựng đọc hiểu</h2>
          <span class="lexicon-count" id="lexiconCount">0 từ</span>
        </div>
        <input id="lexiconSearch" type="search" inputmode="search" enterkeyhint="search" placeholder="Tìm từ Anh hoặc nghĩa Việt..." autocomplete="off" />
        <div class="table-wrap">
          <table class="vocab-table">
            <thead>
              <tr>
                <th class="col-num">#</th>
                <th class="col-en">English</th>
                <th class="col-vi">Nghĩa</th>
              </tr>
            </thead>
            <tbody id="lexiconBody"></tbody>
          </table>
          <div class="lexicon-empty" id="lexiconEmpty">Không tìm thấy từ nào.</div>
        </div>
      </div>
    </div>

    <div id="addPanel" class="hidden">
      <div class="lexicon-card">

        <!-- Chưa đăng nhập: đăng nhập / đăng ký / quên mật khẩu -->
        <div id="authBox">
          <div class="lexicon-head">
            <h2 id="authTitle">Đăng nhập</h2>
          </div>
          <p class="auth-note">Mỗi tài khoản có danh sách từ riêng, chỉ bạn xem được.</p>
          <div class="auth-tabs" id="authTabs">
            <button type="button" class="active" data-auth="login">Đăng nhập</button>
            <button type="button" data-auth="register">Đăng ký</button>
            <button type="button" data-auth="reset">Quên mật khẩu</button>
          </div>
          <form id="authForm" class="add-form" autocomplete="off">
            <label for="authUser">Tên tài khoản</label>
            <input id="authUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="30" placeholder="vd: linh.nguyen" />
            <label for="authPass" id="authPassLabel">Mật khẩu</label>
            <input id="authPass" type="password" autocomplete="off" maxlength="100" />
            <label for="authPass2" id="authPass2Label" class="hidden">Nhập lại mật khẩu</label>
            <input id="authPass2" type="password" autocomplete="off" maxlength="100" class="hidden" />
            <button type="submit" class="primary" id="btnAuth">Đăng nhập</button>
            <div class="feedback" id="authMsg"></div>
          </form>
        </div>

        <!-- Đã đăng nhập: thêm từ -->
        <div id="addBox" class="hidden">
          <div class="lexicon-head">
            <h2>Thêm từ mới</h2>
            <span class="lexicon-count">Vào mục: <b id="addSectionLabel">Đọc hiểu</b></span>
          </div>
          <form id="addForm" class="add-form" autocomplete="off">
            <label for="addEn">Từ tiếng Anh</label>
            <input id="addEn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="vd: Inquiry" maxlength="100" />
            <label for="addVi">Nghĩa</label>
            <input id="addVi" type="text" autocomplete="off" placeholder="vd: (n): sự điều tra, yêu cầu thông tin" maxlength="500" />
            <button type="submit" class="primary" id="btnAdd">Lưu từ</button>
            <div class="feedback" id="addMsg"></div>
          </form>
        </div>

      </div>
    </div>
  </div>

    const STORAGE_KEY = "toeic_vocab_progress_v1";

    const state = {
      section: "reading",
      mode: "practice",
      queue: [],
      index: 0,
      hintCount: 0,
      answered: false,
      canAdvance: false, // unlocks "Từ tiếp theo" once the current card is solved or revealed
    };

    const el = {
      prompt: document.getElementById("prompt"),
      answer: document.getElementById("answer"),
      hintBox: document.getElementById("hintBox"),
      feedback: document.getElementById("feedback"),
      progress: document.getElementById("progress"),
      countReading: document.getElementById("countReading"),
      countListening: document.getElementById("countListening"),
      practicePanel: document.getElementById("practicePanel"),
      practiceCard: document.getElementById("practiceCard"),
      practiceToolbar: document.getElementById("practiceToolbar"),
      sectionTabs: document.getElementById("sectionTabs"),
      lexiconPanel: document.getElementById("lexiconPanel"),
      lexiconBody: document.getElementById("lexiconBody"),
      lexiconTitle: document.getElementById("lexiconTitle"),
      lexiconCount: document.getElementById("lexiconCount"),
      lexiconSearch: document.getElementById("lexiconSearch"),
      lexiconEmpty: document.getElementById("lexiconEmpty"),
      btnNext: document.getElementById("btnNext"),
      addPanel: document.getElementById("addPanel"),
    };

    // ---------- persistence (just remembers which section you were on) ----------
    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          section: state.section,
        }));
      } catch (e) {
        // storage unavailable (private mode, quota, etc.) - fail silently
      }
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== "object") return;
        if (saved.section === "reading" || saved.section === "listening") {
          state.section = saved.section;
        }
      } catch (e) {
        // corrupted data or storage unavailable - ignore and start fresh
      }
    }

    // ---------- helpers ----------
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderLexicon() {
      const list = DATA[state.section] || [];
      const q = normalize(el.lexiconSearch.value);
      const filtered = !q
        ? list
        : list.filter((item) => {
            const en = normalize(item.en);
            const vi = normalize(item.vi);
            return en.includes(q) || vi.includes(q) || item.en.toLowerCase().includes(q) || item.vi.toLowerCase().includes(q);
          });

      el.lexiconTitle.textContent =
        state.section === "reading" ? "Từ vựng đọc hiểu" : "Từ vựng nghe";
      el.lexiconCount.textContent = `${filtered.length} / ${list.length} từ`;

      if (!filtered.length) {
        el.lexiconBody.innerHTML = "";
        el.lexiconEmpty.classList.add("show");
        return;
      }

      el.lexiconEmpty.classList.remove("show");
      el.lexiconBody.innerHTML = filtered
        .map((item) => {
          const num = list.indexOf(item) + 1;
          return `<tr>
            <td class="col-num">${num}</td>
            <td class="col-en">${escapeHtml(item.en)}</td>
            <td class="col-vi">${escapeHtml(item.vi)}${item.id ? ` <button type="button" class="del-word" data-id="${escapeHtml(item.id)}">Xóa</button>` : ""}</td>
          </tr>`;
        })
        .join("");
    }

    function setMode(mode) {
      state.mode = mode;
      const practice = mode === "practice";
      const lexicon = mode === "lexicon";

      el.practicePanel.classList.toggle("hidden", !practice);
      el.practiceToolbar.classList.toggle("hidden", !practice);
      el.lexiconPanel.classList.toggle("hidden", !lexicon);
      el.addPanel.classList.toggle("hidden", mode !== "add");

      [...document.getElementById("modeTabs").querySelectorAll("button")].forEach((b) =>
        b.classList.toggle("active", b.dataset.mode === mode)
      );

      if (lexicon) renderLexicon();
      if (mode === "add") renderAddPanel();
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function normalize(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFC")
        .replace(/[’‘`´]/g, "'")
        .replace(/[.,;:!?"“”()[\]{}]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function primaryAnswer(item) {
      return item.en.trim();
    }

    function acceptedAnswers(item) {
      return [item.en];
    }

    function isCorrect(user, item) {
      const u = normalize(user);
      if (!u) return false;
      const accepts = acceptedAnswers(item).map(normalize);
      if (accepts.some((a) => a === u)) return true;
      // Ignore spaces/hyphen differences
      const compact = (s) => s.replace(/[\s\-]/g, "");
      return accepts.some((a) => compact(a) === compact(u));
    }

    function currentItem() {
      return state.queue[state.index] || null;
    }

    function expectedForHint() {
      const item = currentItem();
      if (!item) return "";
      return primaryAnswer(item);
    }

    function renderHint() {
      const ans = expectedForHint();
      if (!ans || state.hintCount <= 0) {
        el.hintBox.textContent = "";
        return;
      }
      const n = Math.min(state.hintCount, ans.length);
      let out = "";
      for (let i = 0; i < ans.length; i++) {
        if (i < n) out += ans[i];
        else out += ans[i] === " " ? " " : "_";
      }
      el.hintBox.textContent = out;
    }

    function setFeedback(type, html) {
      el.feedback.className = "feedback show " + type;
      el.feedback.innerHTML = html;
    }

    function clearFeedback() {
      el.feedback.className = "feedback";
      el.feedback.textContent = "";
    }

    // "Từ tiếp theo" stays disabled until the current card is solved
    // (correct answer) or revealed (Xem đáp án).
    function updateNextButtonState() {
      el.btnNext.disabled = !state.canAdvance;
    }

    function fillCard() {
      const item = currentItem();
      clearFeedback();
      state.hintCount = 0;
      state.answered = false;
      state.canAdvance = false;
      el.hintBox.textContent = "";
      el.answer.value = "";

      if (!item) {
        el.prompt.textContent = "Không có từ nào.";
        el.progress.textContent = "0 / 0";
        updateNextButtonState();
        return;
      }

      // e.g. "11 / 413" - position within the currently selected section
      // (Đọc hiểu / Nghe), recalculated from the live queue length every
      // time a card is shown so it always matches the section's word count.
      const total = state.queue.length;
      el.progress.textContent = `${state.index + 1} / ${total}`;
      el.prompt.textContent = item.vi;
      el.answer.placeholder = "Nhập từ tiếng Anh...";
      updateNextButtonState();
    }

    // Fade/slide transition when moving between cards
    function showCard({ animate = false } = {}) {
      if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        fillCard();
        el.answer.focus();
        return;
      }
      el.practiceCard.classList.add("card-transition");
      window.setTimeout(() => {
        fillCard();
        el.practiceCard.classList.remove("card-transition");
        el.answer.focus();
      }, 160);
    }

    function rebuildQueue() {
      const list = DATA[state.section] || [];
      state.queue = shuffle(list);
      state.index = 0;
      showCard();
    }

    function nextCard() {
      if (!state.queue.length) return;
      if (!state.canAdvance) return;
      state.index = (state.index + 1) % state.queue.length;
      showCard({ animate: true });
    }

    document.getElementById("modeTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      if (btn.dataset.mode === "practice" && state.mode !== "practice") {
        setMode("practice");
        rebuildQueue();
        return;
      }
      setMode(btn.dataset.mode);
    });

    document.getElementById("sectionTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-section]");
      if (!btn) return;
      state.section = btn.dataset.section;
      saveProgress();
      [...document.getElementById("sectionTabs").querySelectorAll("button")].forEach((b) =>
        b.classList.toggle("active", b === btn)
      );
      if (state.mode === "practice") rebuildQueue();
      else if (state.mode === "lexicon") renderLexicon();
      else if (state.mode === "add") updateAddLabel();
    });

    el.lexiconSearch.addEventListener("input", () => renderLexicon());

    document.getElementById("btnShuffle").addEventListener("click", () => rebuildQueue());

    document.getElementById("btnHint").addEventListener("click", () => {
      const ans = expectedForHint();
      if (!ans) return;
      if (state.hintCount < ans.length) {
        state.hintCount += 1;
        renderHint();
        // Prefill revealed prefix into input to help typing
        el.answer.value = ans.slice(0, state.hintCount);
        el.answer.focus();
        try {
          el.answer.setSelectionRange(el.answer.value.length, el.answer.value.length);
        } catch (_) {}
      } else {
        setFeedback("info", "Đã hiện hết các ký tự gợi ý.");
      }
    });

    document.getElementById("btnCheck").addEventListener("click", () => {
      const item = currentItem();
      if (!item) return;
      const user = el.answer.value;
      if (!user.trim()) {
        setFeedback("info", "Hãy nhập đáp án trước.");
        return;
      }
      if (isCorrect(user, item)) {
        state.answered = true;
        state.canAdvance = true;
        setFeedback(
          "ok",
          `Đúng!<br><small>EN: <b>${escapeHtml(item.en)}</b><br>VI: <b>${escapeHtml(item.vi)}</b></small>`
        );
        updateNextButtonState();
      } else {
        state.answered = true;
        setFeedback("bad", "Chưa đúng. Thử lại, dùng gợi ý, hoặc xem đáp án.");
        // canAdvance stays false here - must get it right or reveal the
        // answer before moving on.
        updateNextButtonState();
      }
    });

    document.getElementById("btnShow").addEventListener("click", () => {
      const item = currentItem();
      if (!item) return;
      state.answered = true;
      state.hintCount = expectedForHint().length;
      renderHint();
      el.answer.value = primaryAnswer(item);
      setFeedback(
        "info",
        `Đáp án:<br><small>EN: <b>${escapeHtml(item.en)}</b><br>VI: <b>${escapeHtml(item.vi)}</b></small>`
      );
      // Seeing the answer also counts as "done" for this card, so the
      // user isn't stuck unable to move on.
      state.canAdvance = true;
      updateNextButtonState();
    });

    document.getElementById("btnNext").addEventListener("click", () => nextCard());

    el.answer.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (state.answered && el.feedback.classList.contains("ok")) nextCard();
        else document.getElementById("btnCheck").click();
      }
    });

    // Phím tắt: Tab = Gợi ý
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Tab" || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
      const t = e.target;
      const isOtherField = t && t !== el.answer && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
      if (isOtherField) return; // giữ Tab bình thường ở ô tìm kiếm...
      if (!el.answer || el.answer.offsetParent === null) return; // chỉ khi đang ở màn luyện tập
      e.preventDefault();
      document.getElementById("btnHint").click();
    });

    // ---------- tài khoản + từ riêng (lưu trên máy chủ) ----------
    const API = "/api";
    const SESSION_KEY = "toeic_session_v2";
    const BASE = { reading: DATA.reading.slice(), listening: DATA.listening.slice() };
    const custom = { reading: [], listening: [] };
    const session = { token: "", username: "" };
    let authMode = "login";

    const ui = {
      accountBar: document.getElementById("accountBar"),
      authBox: document.getElementById("authBox"),
      addBox: document.getElementById("addBox"),
      authTabs: document.getElementById("authTabs"),
      authTitle: document.getElementById("authTitle"),
      authForm: document.getElementById("authForm"),
      authUser: document.getElementById("authUser"),
      authPass: document.getElementById("authPass"),
      authPass2: document.getElementById("authPass2"),
      authPassLabel: document.getElementById("authPassLabel"),
      authPass2Label: document.getElementById("authPass2Label"),
      btnAuth: document.getElementById("btnAuth"),
      authMsg: document.getElementById("authMsg"),
      addForm: document.getElementById("addForm"),
      addEn: document.getElementById("addEn"),
      addVi: document.getElementById("addVi"),
      addMsg: document.getElementById("addMsg"),
      btnAdd: document.getElementById("btnAdd"),
      addSectionLabel: document.getElementById("addSectionLabel"),
    };

    const NET_ERR = "Không kết nối được máy chủ. Tính năng tài khoản chỉ chạy khi đã deploy lên Netlify.";

    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        if (s && typeof s.token === "string" && typeof s.username === "string") {
          session.token = s.token;
          session.username = s.username;
        }
      } catch (e) {}
    }
    function saveSession() {
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
    }
    function clearSession() {
      session.token = "";
      session.username = "";
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }
    const loggedIn = () => !!session.token;

    async function api(path, { method = "GET", body } = {}) {
      const headers = {};
      if (body) headers["content-type"] = "application/json";
      if (session.token) headers.authorization = "Bearer " + session.token;
      const res = await fetch(API + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store",
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    function rebuildData() {
      DATA.reading = BASE.reading.concat(custom.reading);
      DATA.listening = BASE.listening.concat(custom.listening);
      el.countReading.textContent = DATA.reading.length;
      el.countListening.textContent = DATA.listening.length;
    }

    function setMsg(box, type, text) {
      box.className = "feedback show " + type;
      box.textContent = text;
    }
    function clearMsg(box) {
      box.className = "feedback";
      box.textContent = "";
    }

    function renderAccountBar() {
      ui.accountBar.innerHTML = loggedIn()
        ? `<span>Xin chào, <b>${escapeHtml(session.username)}</b></span><button type="button" data-act="logout">Đăng xuất</button>`
        : `<span>Chưa đăng nhập</span><button type="button" data-act="login">Đăng nhập / Đăng ký</button>`;
    }

    function updateAddLabel() {
      ui.addSectionLabel.textContent = state.section === "reading" ? "Đọc hiểu" : "Nghe";
    }

    function renderAddPanel() {
      const inn = loggedIn();
      ui.authBox.classList.toggle("hidden", inn);
      ui.addBox.classList.toggle("hidden", !inn);
      if (inn) updateAddLabel();
      else setAuthMode(authMode);
    }

    function setAuthMode(mode) {
      authMode = mode;
      const titles = { login: "Đăng nhập", register: "Tạo tài khoản", reset: "Quên mật khẩu" };
      const btns = { login: "Đăng nhập", register: "Tạo tài khoản", reset: "Đổi mật khẩu" };
      ui.authTitle.textContent = titles[mode];
      ui.btnAuth.textContent = btns[mode];
      const needConfirm = mode !== "login";
      ui.authPassLabel.textContent = mode === "reset" ? "Mật khẩu mới" : "Mật khẩu";
      ui.authPass2Label.textContent = mode === "reset" ? "Nhập lại mật khẩu mới" : "Nhập lại mật khẩu";
      ui.authPass2Label.classList.toggle("hidden", !needConfirm);
      ui.authPass2.classList.toggle("hidden", !needConfirm);
      ui.authPass.autocomplete = mode === "login" ? "current-password" : "new-password";
      [...ui.authTabs.querySelectorAll("button")].forEach((b) =>
        b.classList.toggle("active", b.dataset.auth === mode)
      );
      clearMsg(ui.authMsg);
    }

    function resetCustomData() {
      custom.reading = [];
      custom.listening = [];
      rebuildData();
    }

    function refreshAfterDataChange() {
      if (state.mode === "practice") rebuildQueue();
      else if (state.mode === "lexicon") renderLexicon();
    }

    function logout() {
      clearSession();
      resetCustomData();
      renderAccountBar();
      if (state.mode === "add") renderAddPanel();
      else refreshAfterDataChange();
    }

    async function loadCustom() {
      if (!loggedIn()) return;
      try {
        const r = await api("/words");
        if (r.status === 401) { logout(); return; }
        if (!r.ok) return;
        custom.reading = Array.isArray(r.data.reading) ? r.data.reading : [];
        custom.listening = Array.isArray(r.data.listening) ? r.data.listening : [];
        rebuildData();
        const hasCustom = custom.reading.length + custom.listening.length > 0;
        const untouched = state.mode === "practice" && state.index === 0 && !state.answered &&
          !el.answer.value && state.hintCount === 0;
        if (hasCustom && untouched) rebuildQueue();
        else if (state.mode === "lexicon") renderLexicon();
      } catch (e) {
        // không có máy chủ: vẫn dùng bộ từ gốc
      }
    }

    async function onLoggedIn(data) {
      session.token = data.token;
      session.username = data.username;
      saveSession();
      renderAccountBar();
      ui.authPass.value = "";
      ui.authPass2.value = "";
      renderAddPanel();
      await loadCustom();
    }

    // --- các nút trên thanh tài khoản ---
    ui.accountBar.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      if (b.dataset.act === "logout") logout();
      else if (b.dataset.act === "login") setMode("add");
    });

    ui.authTabs.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-auth]");
      if (b) setAuthMode(b.dataset.auth);
    });

    // --- đăng nhập / đăng ký / quên mật khẩu ---
    ui.authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (ui.btnAuth.disabled) return;
      const username = ui.authUser.value.trim();
      const pass = ui.authPass.value;
      const pass2 = ui.authPass2.value;
      if (!username || !pass) return setMsg(ui.authMsg, "bad", "Hãy nhập tên tài khoản và mật khẩu.");
      if (authMode !== "login") {
        if (pass.length < 6) return setMsg(ui.authMsg, "bad", "Mật khẩu cần ít nhất 6 ký tự.");
        if (pass !== pass2) return setMsg(ui.authMsg, "bad", "Hai lần nhập mật khẩu chưa giống nhau.");
      }
      ui.btnAuth.disabled = true;
      setMsg(ui.authMsg, "info", "Đang xử lý...");
      try {
        if (authMode === "reset") {
          const r = await api("/reset", { method: "POST", body: { username, newPassword: pass } });
          if (r.ok) {
            const name = username;
            setAuthMode("login");
            ui.authUser.value = name;
            ui.authPass.value = "";
            ui.authPass2.value = "";
            setMsg(ui.authMsg, "ok", "Đã đổi mật khẩu. Hãy đăng nhập bằng mật khẩu mới.");
          } else {
            setMsg(ui.authMsg, "bad", r.data.error || "Không đổi được mật khẩu.");
          }
        } else {
          const path = authMode === "register" ? "/register" : "/login";
          const r = await api(path, { method: "POST", body: { username, password: pass } });
          if (r.ok && r.data.token) await onLoggedIn(r.data);
          else setMsg(ui.authMsg, "bad", r.data.error || "Không thực hiện được, thử lại sau.");
        }
      } catch (err) {
        setMsg(ui.authMsg, "bad", NET_ERR);
      } finally {
        ui.btnAuth.disabled = false;
      }
    });

    // --- thêm từ ---
    ui.addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (ui.btnAdd.disabled) return;
      const section = state.section;
      const en = ui.addEn.value.trim();
      const vi = ui.addVi.value.trim();
      if (!en || !vi) return setMsg(ui.addMsg, "bad", "Hãy nhập cả từ tiếng Anh và nghĩa.");
      if ((DATA[section] || []).some((w) => normalize(w.en) === normalize(en))) {
        return setMsg(ui.addMsg, "bad", "Từ này đã có trong mục này rồi.");
      }
      ui.btnAdd.disabled = true;
      setMsg(ui.addMsg, "info", "Đang lưu...");
      try {
        const r = await api("/words", { method: "POST", body: { section, en, vi } });
        if (r.status === 201 && r.data.item) {
          custom[section].push(r.data.item);
          rebuildData();
          ui.addEn.value = "";
          ui.addVi.value = "";
          setMsg(ui.addMsg, "ok", `Đã thêm "${en}". Từ mới sẽ xuất hiện khi bạn quay lại Luyện tập.`);
          ui.addEn.focus();
        } else if (r.status === 401) {
          logout();
          setMsg(ui.authMsg, "bad", "Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.");
        } else {
          setMsg(ui.addMsg, "bad", r.data.error || "Không lưu được, thử lại sau.");
        }
      } catch (err) {
        setMsg(ui.addMsg, "bad", NET_ERR);
      } finally {
        ui.btnAdd.disabled = false;
      }
    });

    // --- xóa từ (chỉ từ của chính mình) ---
    el.lexiconBody.addEventListener("click", async (e) => {
      const btn = e.target.closest(".del-word");
      if (!btn) return;
      if (!window.confirm("Xóa từ này?")) return;
      const id = btn.dataset.id;
      try {
        const r = await api(`/words?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        if (r.ok) {
          custom.reading = custom.reading.filter((w) => w.id !== id);
          custom.listening = custom.listening.filter((w) => w.id !== id);
          rebuildData();
          renderLexicon();
        } else if (r.status === 401) {
          logout();
          window.alert("Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.");
        } else {
          window.alert(r.data.error || "Không xóa được, thử lại sau.");
        }
      } catch (err) {
        window.alert("Không kết nối được máy chủ.");
      }
    });

    // init
    loadProgress();
    el.countReading.textContent = DATA.reading.length;
    el.countListening.textContent = DATA.listening.length;
    [...document.getElementById("sectionTabs").querySelectorAll("button")].forEach((b) =>
      b.classList.toggle("active", b.dataset.section === state.section)
    );
    rebuildQueue();
    loadSession();
    renderAccountBar();
    loadCustom();
  </script>
</body>
</html>
